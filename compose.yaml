services:
  db:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: quorum
      MYSQL_USER: quorum
      MYSQL_PASSWORD: quorum_dev
      MYSQL_ROOT_PASSWORD: root_dev

    ports:
      - "3307:3306"

    volumes:
      - quorum_mysql_data:/var/lib/mysql

    networks:
      - quorum_network

    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./Backend:/var/www/html

    ports:
      - "8001:8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - quorum_network

    command: >
      sh -c "
      composer install &&
      php artisan serve --host=0.0.0.0 --port=8000
      "

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    working_dir: /app

    volumes:
      - ./Frontend:/app
      - quorum_node_modules:/app/node_modules

    ports:
      - "5174:5173"

    environment:
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      - backend

    networks:
      - quorum_network

    command: >
      sh -c "
      npm install &&
      npm run dev -- --host 0.0.0.0
      "

  adminer:
    image: adminer:latest
    restart: unless-stopped

    ports:
      - "8082:8080"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - quorum_network

networks:
  quorum_network:
    driver: bridge

volumes:
  quorum_mysql_data:
  quorum_node_modules:
